services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rnd
      POSTGRES_PASSWORD: rnd_dev_password
      POSTGRES_DB: trending_rnd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Trending_RnD/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rnd:rnd_dev_password@postgres:5432/trending_rnd
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Trending_RnD/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
